# 智能文档和图片清理器配置文件
# 配置文件版本: 1.0
# 最后更新: 2025-01-27

# ============================================================================
# 应用程序基本信息
# ============================================================================
app_info:
  # 应用程序名称
  # 作用: 标识应用程序的名称，用于日志记录和用户界面显示
  # 类型: 字符串
  # 默认值: "智能文档和图片清理器"
  name: "智能文档和图片清理器"
  
  # 应用程序版本号
  # 作用: 标识当前应用程序的版本，用于版本管理和兼容性检查
  # 格式: 主版本号.次版本号.修订号
  # 默认值: "1.0.0"
  version: "1.0.0"
  
  # 应用程序描述
  # 作用: 简要说明应用程序的主要功能和用途
  # 类型: 字符串
  # 默认值: 如下所示
  description: "专门用于清理文档类型文件和图片文件，同时保护代码文件和配置文件"

# ============================================================================
# 默认设置 - 应用程序核心行为配置
# ============================================================================
default_settings:
  # 模拟运行模式
  # 作用: 启用后只模拟删除操作，不实际删除文件，用于安全测试
  # 可选值: true（启用模拟模式）, false（实际执行删除）
  # 默认值: true
  # 建议: 首次使用时保持为true，确认无误后再设为false
  dry_run: true
  
  # 创建备份
  # 作用: 删除文件前是否创建备份副本
  # 可选值: true（创建备份）, false（不创建备份）
  # 默认值: false
  # 注意: 启用备份会占用额外存储空间，但提供数据恢复能力
  create_backup: false
  
  # 显示进度信息
  # 作用: 控制是否在控制台显示操作进度和详细信息
  # 可选值: true（显示进度）, false（静默运行）
  # 默认值: true
  # 用途: 帮助用户了解当前操作状态和进度
  show_progress: true
  
  # 保存操作报告
  # 作用: 是否生成并保存详细的操作报告文件
  # 可选值: true（保存报告）, false（不保存报告）
  # 默认值: true
  # 用途: 便于后续审计、分析和问题排查
  save_report: true
  
  # 删除前确认
  # 作用: 执行删除操作前是否需要用户确认
  # 可选值: true（需要确认）, false（自动执行）
  # 默认值: true
  # 安全性: 强烈建议保持为true，防止误操作
  confirm_before_delete: true

# ============================================================================
# 文件处理设置 - 文件系统操作控制参数
# ============================================================================
file_settings:
  # 最大文件大小限制（单位：MB）
  # 作用: 限制处理的单个文件最大大小，避免处理超大文件导致性能问题
  # 可选值: 1-10240（1MB到10GB）
  # 默认值: 1024
  # 建议: 根据系统内存和性能调整，一般设置为512-2048MB
  max_file_size_mb: 1024
  
  # 扫描子目录
  # 作用: 是否递归扫描目标目录下的所有子目录
  # 可选值: true（递归扫描）, false（仅扫描当前目录）
  # 默认值: true
  # 注意: 启用后会扫描所有子目录，可能增加处理时间
  scan_subdirectories: true
  
  # 跟随符号链接
  # 作用: 是否跟随和处理符号链接指向的文件
  # 可选值: true（跟随链接）, false（忽略链接）
  # 默认值: false
  # 安全性: 建议保持为false，避免循环引用和安全问题
  follow_symlinks: false
  
  # 忽略隐藏文件
  # 作用: 是否忽略以点(.)开头的隐藏文件
  # 可选值: true（忽略隐藏文件）, false（处理隐藏文件）
  # 默认值: true
  # 用途: 保护系统配置文件和用户隐私文件
  ignore_hidden_files: true

# ============================================================================
# 报告设置 - 操作报告生成和格式配置
# ============================================================================
report_settings:
  # 报告文件格式
  # 作用: 指定生成报告的文件格式
  # 可选值: "json"（JSON格式）, "yaml"（YAML格式）, "txt"（纯文本）
  # 默认值: "json"
  # 建议: JSON格式便于程序处理，TXT格式便于人工阅读
  report_format: "json"
  
  # 包含文件详细信息
  # 作用: 报告中是否包含每个文件的详细信息（大小、修改时间等）
  # 可选值: true（包含详细信息）, false（仅包含基本信息）
  # 默认值: true
  # 用途: 详细信息有助于审计和数据恢复
  include_file_details: true
  
  # 时间戳格式
  # 作用: 报告文件名中时间戳的格式
  # 格式: Python strftime格式字符串
  # 默认值: "%Y%m%d_%H%M%S"（年月日_时分秒）
  # 示例: 20250127_143022
  timestamp_format: "%Y%m%d_%H%M%S"

# ============================================================================
# 输出目录设置 - 各类文件的存储位置
# ============================================================================
output_dirs:
  # 报告文件输出目录
  # 作用: 指定操作报告文件的存储目录
  # 类型: 相对路径或绝对路径
  # 默认值: "reports"
  # 注意: 目录不存在时会自动创建
  reports: "reports"
  
  # 备份文件存储目录
  # 作用: 指定删除文件备份的存储目录
  # 类型: 相对路径或绝对路径
  # 默认值: "backups"
  # 建议: 选择有足够空间的目录
  backups: "backups"
  
  # 日志文件输出目录
  # 作用: 指定应用程序日志文件的存储目录
  # 类型: 相对路径或绝对路径
  # 默认值: "logs"
  # 用途: 记录程序运行状态和错误信息
  logs: "logs"

# ============================================================================
# 安全设置 - 数据保护和系统安全配置
# ============================================================================
safety_settings:
  # 需要用户确认
  # 作用: 执行危险操作前是否需要用户明确确认
  # 可选值: true（需要确认）, false（自动执行）
  # 默认值: true
  # 安全性: 强烈建议保持为true
  require_confirmation: true
  
  # 保护系统文件
  # 作用: 是否启用系统文件保护机制
  # 可选值: true（保护系统文件）, false（不特殊保护）
  # 默认值: true
  # 用途: 防止误删除重要系统文件导致系统不稳定
  protect_system_files: true
  
  # 最小剩余磁盘空间（单位：MB）
  # 作用: 确保操作后磁盘至少保留的空闲空间
  # 可选值: 50-1024（50MB到1GB）
  # 默认值: 100
  # 用途: 防止磁盘空间耗尽影响系统正常运行
  min_free_space_mb: 100

# ============================================================================
# 性能设置 - 系统性能和资源使用优化
# ============================================================================
performance_settings:
  # 批处理大小
  # 作用: 单次批量处理的文件数量
  # 可选值: 10-1000
  # 默认值: 100
  # 调优: 较大值提高效率但占用更多内存，较小值更稳定
  batch_size: 100
  
  # 最大工作线程数
  # 作用: 并行处理时使用的最大线程数量
  # 可选值: 1-16（建议不超过CPU核心数的2倍）
  # 默认值: 4
  # 建议: 根据CPU核心数调整，一般设为核心数或核心数+1
  max_workers: 4
  
  # 内存使用限制（单位：MB）
  # 作用: 程序运行时的最大内存使用量
  # 可选值: 128-2048（128MB到2GB）
  # 默认值: 512
  # 用途: 防止程序占用过多内存影响系统性能
  memory_limit_mb: 512

# ============================================================================
# 日志设置 - 程序运行日志配置
# ============================================================================
log_settings:
  # 日志记录级别
  # 作用: 控制记录日志的详细程度
  # 可选值: "DEBUG"（调试信息）, "INFO"（一般信息）, "WARNING"（警告）, "ERROR"（错误）, "CRITICAL"（严重错误）
  # 默认值: "INFO"
  # 建议: 正常使用时设为INFO，调试时设为DEBUG
  log_level: "INFO"
  
  # 记录到文件
  # 作用: 是否将日志信息写入文件
  # 可选值: true（写入文件）, false（不写入文件）
  # 默认值: true
  # 用途: 持久化日志信息，便于问题排查
  log_to_file: true
  
  # 输出到控制台
  # 作用: 是否在控制台实时显示日志信息
  # 可选值: true（显示到控制台）, false（不显示）
  # 默认值: true
  # 用途: 实时查看程序运行状态
  log_to_console: true
  
  # 最大日志文件大小（单位：MB）
  # 作用: 单个日志文件的最大大小，超过后会创建新文件
  # 可选值: 1-100（1MB到100MB）
  # 默认值: 10
  # 用途: 防止日志文件过大影响性能
  max_log_size_mb: 10
  
  # 日志备份文件数量
  # 作用: 保留的历史日志文件数量
  # 可选值: 1-20
  # 默认值: 5
  # 用途: 保留足够的历史日志用于问题追踪
  backup_count: 5

# ============================================================================
# 文件类型配置 - 定义各种文件类型的扩展名
# ============================================================================
file_types:
  # 文档类型文件扩展名（将被清理的文件类型）
  # 作用: 定义哪些文件扩展名被认为是文档文件
  # 格式: 扩展名列表，包含点号
  # 用途: 智能识别和清理文档文件
  document_extensions:
    - ".txt"      # 纯文本文件
    - ".doc"      # Word文档（旧格式）
    - ".docx"     # Word文档（新格式）
    - ".pdf"      # PDF文档
    - ".rtf"      # 富文本格式
    - ".odt"      # OpenDocument文本
    - ".pages"    # Apple Pages文档
    - ".xls"      # Excel表格（旧格式）
    - ".xlsx"     # Excel表格（新格式）
    - ".ppt"      # PowerPoint演示文稿（旧格式）
    - ".pptx"     # PowerPoint演示文稿（新格式）
    - ".odp"      # OpenDocument演示文稿
    - ".ods"      # OpenDocument表格
    - ".md"       # Markdown文档
    - ".markdown" # Markdown文档
    - ".rst"      # reStructuredText文档
    - ".tex"      # LaTeX文档
    - ".latex"    # LaTeX文档
  
  # 图片类型文件扩展名（将被清理的文件类型）
  # 作用: 定义哪些文件扩展名被认为是图片文件
  # 格式: 扩展名列表，包含点号
  # 用途: 智能识别和清理图片文件
  image_extensions:
    - ".jpg"      # JPEG图片
    - ".jpeg"     # JPEG图片
    - ".png"      # PNG图片
    - ".gif"      # GIF动图
    - ".bmp"      # 位图
    - ".tiff"     # TIFF图片
    - ".tif"      # TIFF图片
    - ".webp"     # WebP图片
    - ".svg"      # 矢量图
    - ".ico"      # 图标文件
    - ".psd"      # Photoshop文档
    - ".ai"       # Adobe Illustrator文件
    - ".eps"      # 封装PostScript
    - ".raw"      # 原始图像格式
    - ".cr2"      # Canon原始格式
    - ".nef"      # Nikon原始格式
    - ".arw"      # Sony原始格式
    - ".dng"      # Adobe数字负片
    - ".heic"     # 高效图像格式
    - ".heif"     # 高效图像格式
  
  # 代码文件扩展名（受保护，不会被清理）
  # 作用: 定义哪些文件扩展名被认为是代码文件，需要保护
  # 格式: 扩展名列表，包含点号
  # 用途: 防止误删除重要的源代码文件
  code_extensions:
    - ".py"       # Python源码
    - ".js"       # JavaScript源码
    - ".java"     # Java源码
    - ".c"        # C语言源码
    - ".cpp"      # C++源码
    - ".h"        # C/C++头文件
    - ".hpp"      # C++头文件
    - ".cs"       # C#源码
    - ".php"      # PHP源码
    - ".rb"       # Ruby源码
    - ".go"       # Go语言源码
    - ".rs"       # Rust源码
    - ".swift"    # Swift源码
    - ".kt"       # Kotlin源码
    - ".ts"       # TypeScript源码
    - ".jsx"      # React JSX文件
    - ".tsx"      # TypeScript JSX文件
    - ".vue"      # Vue.js组件
    - ".html"     # HTML文件
    - ".css"      # CSS样式表
    - ".scss"     # Sass样式表
    - ".sass"     # Sass样式表
    - ".less"     # Less样式表
    - ".sql"      # SQL脚本
    - ".sh"       # Shell脚本
    - ".bat"      # Windows批处理
    - ".ps1"      # PowerShell脚本
    - ".vbs"      # VBScript脚本
  
  # 配置文件扩展名（受保护，不会被清理）
  # 作用: 定义哪些文件扩展名被认为是配置文件，需要保护
  # 格式: 扩展名列表，包含点号
  # 用途: 防止误删除重要的配置文件
  config_extensions:
    - ".config"       # 通用配置文件
    - ".conf"         # 配置文件
    - ".cfg"          # 配置文件
    - ".ini"          # Windows配置文件
    - ".env"          # 环境变量文件
    - ".properties"   # Java属性文件
    - ".yaml"         # YAML配置文件
    - ".yml"          # YAML配置文件
    - ".toml"         # TOML配置文件
    - ".xml"          # XML配置文件
    - ".json"         # JSON配置文件
    - ".lock"         # 锁定文件
    - ".gitignore"    # Git忽略文件
    - ".gitattributes" # Git属性文件
    - ".editorconfig" # 编辑器配置
  
  # 程序文件扩展名（受保护，不会被清理）
  # 作用: 定义哪些文件扩展名被认为是可执行程序，需要保护
  # 格式: 扩展名列表，包含点号
  # 用途: 防止误删除重要的可执行文件
  program_extensions:
    - ".exe"      # Windows可执行文件
    - ".dll"      # Windows动态链接库
    - ".so"       # Linux共享库
    - ".dylib"    # macOS动态库
    - ".app"      # macOS应用程序
    - ".deb"      # Debian安装包
    - ".rpm"      # Red Hat安装包
    - ".msi"      # Windows安装包
    - ".pkg"      # macOS安装包
    - ".dmg"      # macOS磁盘镜像
    - ".iso"      # 光盘镜像
    - ".jar"      # Java归档文件
    - ".war"      # Web应用归档
    - ".ear"      # 企业应用归档
  
  # 临时文件扩展名（可以被清理）
  # 作用: 定义哪些文件扩展名被认为是临时文件，可以安全清理
  # 格式: 扩展名列表，包含点号
  # 用途: 清理系统产生的临时文件，释放磁盘空间
  temp_extensions:
    - ".tmp"          # 临时文件
    - ".temp"         # 临时文件
    - ".log"          # 日志文件
    - ".bak"          # 备份文件
    - ".backup"       # 备份文件
    - ".old"          # 旧文件
    - ".cache"        # 缓存文件
    - ".thumbs.db"    # Windows缩略图缓存
    - ".ds_store"     # macOS目录服务存储
    - ".desktop.ini"  # Windows桌面配置
    - ".dmp"          # 转储文件
    - ".crash"        # 崩溃报告文件

# ============================================================================
# 高级配置 - 专家级用户配置选项
# ============================================================================
advanced_settings:
  # 启用调试模式
  # 作用: 启用详细的调试信息输出
  # 可选值: true（启用调试）, false（正常模式）
  # 默认值: false
  # 注意: 调试模式会产生大量日志信息
  debug_mode: false
  
  # 配置文件自动重载
  # 作用: 检测到配置文件变化时是否自动重新加载
  # 可选值: true（自动重载）, false（手动重载）
  # 默认值: false
  # 用途: 开发和调试时的便利功能
  auto_reload_config: false
  
  # 操作超时时间（单位：秒）
  # 作用: 单个文件操作的最大等待时间
  # 可选值: 30-300（30秒到5分钟）
  # 默认值: 60
  # 用途: 防止程序在处理大文件时无限等待
  operation_timeout: 60